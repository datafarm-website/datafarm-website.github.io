name: Claude publish

# Claude edits the site from a prompt, then the change is committed and pushed
# to main with the Claude GitHub App token, so the push (and the Activity
# entry) is attributed to claude[bot]. That push fires trigger-pages.yml,
# which redeploys the site as github-actions[bot].
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "What Claude should change on the site"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: claude-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ inputs.prompt }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --allowedTools Read,Edit,Write,Glob,Grep
          # The action's default bot_id is github-actions[bot]'s; use claude[bot]'s.
          bot_id: "209825114"
          bot_name: "claude[bot]"

      - name: Commit and push as claude[bot]
        env:
          APP_TOKEN: ${{ steps.claude.outputs.github_token }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "::error::No Claude App token; refusing to push with another identity."
            exit 1
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          # git user.name/user.email were set to claude[bot] by the action.
          git commit -m "Update site" -m "$PROMPT"
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
